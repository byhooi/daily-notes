name: 项目检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # ubuntu-latest 已滚动到 26.04，而 playwright 1.58.2 的浏览器依赖只覆盖到 24.04，
    # 会报 "Playwright does not support chromium on ubuntu26.04-x64"。
    # 升级 @playwright/test 到 1.65+（已支持 26.04）之后可改回 ubuntu-latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:generated
      - run: npm run build
      - run: git diff --exit-code -- assets/tailwind.min.css index.html 3A.html 3B.html 4A.html 4B.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
